<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay — Поиск / создание пациента</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="frame">
    <div class="top-nav">
      <a href="screen1-start.html">← Назад к сбору заказа</a>
      <a href="screen1-sunny.html">К выбранному пациенту →</a>
    </div>

    <h2>Overlay: Поиск / создание пациента</h2>
    <div class="grid-2">
      <div class="block">
        <h3>Поиск</h3>
        <input placeholder="Фамилия / телефон / код / почта">
        <div class="meta">Результаты</div>
        <div class="row">
          <div>
            <strong>Иванова Мария Петровна</strong><br>
            <span class="meta">12.03.1987 · +7 999 111-22-33</span>
          </div>
          <a class="btn" href="screen1-sunny.html">Выбрать</a>
        </div>
      </div>
      <div class="block">
        <h3>Если не найден</h3>
        <input placeholder="ФИО">
        <input placeholder="Дата рождения">
        <div class="row-wrap">
          <label class="chip"><input type="radio"> Жен</label>
          <label class="chip"><input type="radio"> Муж</label>
        </div>
        <input placeholder="Телефон">
        <input placeholder="Email">
        <div class="actions">
          <a class="btn" href="screen1-sunny.html">Сохранить и выбрать</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
